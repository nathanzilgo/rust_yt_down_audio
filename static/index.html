<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yt_down — YouTube to MP3</title>
    <meta name="description"
        content="Download YouTube videos as MP3 audio files instantly. Paste a link, click download.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(139, 92, 246, 0.5);
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --text-muted: #55556a;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --error: #ef4444;
            --success: #22c55e;
            --gradient-1: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            --gradient-2: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }

        .bg-orb-1 {
            width: 600px;
            height: 600px;
            background: var(--accent);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .bg-orb-2 {
            width: 500px;
            height: 500px;
            background: #ec4899;
            bottom: -200px;
            left: -100px;
            animation-delay: -7s;
        }

        .bg-orb-3 {
            width: 400px;
            height: 400px;
            background: #6366f1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
            opacity: 0.08;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(30px, -30px) scale(1.05);
            }

            50% {
                transform: translate(-20px, 20px) scale(0.95);
            }

            75% {
                transform: translate(20px, 10px) scale(1.02);
            }
        }

        /* Grid pattern overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 0 24px;
        }

        /* Logo / Title */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 32px var(--accent-glow);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 8px 32px var(--accent-glow);
            }

            50% {
                box-shadow: 0 8px 48px rgba(139, 92, 246, 0.4);
            }
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: rgba(255, 255, 255, 0.06);
        }

        input[type="text"]:focus~.input-icon {
            opacity: 1;
        }

        /* Download Button */
        .btn-download {
            width: 100%;
            padding: 16px 24px;
            background: var(--gradient-1);
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px var(--accent-glow);
        }

        .btn-download::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(139, 92, 246, 0.4);
        }

        .btn-download:hover:not(:disabled)::before {
            opacity: 1;
        }

        .btn-download:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-icon {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .btn-download:hover:not(:disabled) .btn-icon {
            transform: translateY(2px);
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-download.loading .spinner {
            display: block;
        }

        .btn-download.loading .btn-text,
        .btn-download.loading .btn-icon {
            display: none;
        }

        /* Status message */
        .status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            flex-direction: column;
            gap: 8px;
            animation: slide-in 0.3s ease;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status.visible {
            display: flex;
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .status.info {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
        }

        .status-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .status-details {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.8;
            max-height: 120px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 8px 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status-details::-webkit-scrollbar {
            width: 4px;
        }

        .status-details::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        .status-toggle {
            background: none;
            border: none;
            color: inherit;
            font-size: 12px;
            cursor: pointer;
            opacity: 0.7;
            padding: 2px 0;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .status-toggle:hover {
            opacity: 1;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 32px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent);
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 16px;
            display: none;
            flex-direction: column;
            gap: 8px;
            animation: slide-in 0.3s ease;
        }

        .progress-container.visible {
            display: flex;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--gradient-1);
            width: 0%;
            border-radius: 3px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .progress-bar-fill.indeterminate {
            width: 30% !important;
            animation: progress-indeterminate 1.5s infinite ease-in-out;
        }

        @keyframes progress-indeterminate {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(330%);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 0 16px;
            }

            .card {
                padding: 24px;
            }

            .logo-text {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <!-- Background orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🎵</div>
                <span class="logo-text">yt_down</span>
            </div>
            <p class="subtitle">Paste a YouTube link, download the audio as MP3</p>
        </header>

        <main class="card" id="download-card">
            <div class="form-group">
                <label for="url-input">YouTube URL</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔗</span>
                    <input type="text" id="url-input" placeholder="https://www.youtube.com/watch?v=..."
                        autocomplete="off" spellcheck="false">
                </div>
            </div>

            <button class="btn-download" id="download-btn" onclick="handleDownload()">
                <span class="btn-icon">⬇</span>
                <span class="btn-text">Download MP3</span>
                <div class="spinner"></div>
            </button>

            <div class="progress-container" id="progress-container">
                <div class="progress-label">
                    <span id="progress-status">Downloading...</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>

            <div class="status" id="status">
                <div class="status-header">
                    <span class="status-icon" id="status-icon"></span>
                    <span id="status-text"></span>
                </div>
                <div id="status-extra"></div>
            </div>
        </main>

        <footer class="footer">
            Powered by <a href="https://github.com/yt-dlp/yt-dlp" target="_blank" rel="noopener">yt-dlp</a> &middot;
            Built with Rust by <a href="https://github.com/nathanzilgo" target="_blank" rel="noopener">Zilgo
                Stardust</a>
            <br>
            <a href="https://github.com/nathanzilgo/rust_yt_down_audio" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> src code</a>
        </footer>
    </div>

    <script>
        const urlInput = document.getElementById('url-input');
        const downloadBtn = document.getElementById('download-btn');
        const status = document.getElementById('status');
        const statusIcon = document.getElementById('status-icon');
        const statusText = document.getElementById('status-text');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const progressStatus = document.getElementById('progress-status');

        // Allow pressing Enter to submit
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleDownload();
        });

        const statusExtra = document.getElementById('status-extra');

        function showStatus(type, icon, message, details) {
            status.className = 'status visible ' + type;
            statusIcon.textContent = icon;
            statusText.textContent = message;
            if (details) {
                statusExtra.innerHTML = `<button class="status-toggle" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'; this.textContent = this.nextElementSibling.style.display === 'none' ? '▶ Show details' : '▼ Hide details'">▶ Show details</button><div class="status-details" style="display:none"></div>`;
                statusExtra.querySelector('.status-details').textContent = details;
            } else {
                statusExtra.innerHTML = '';
            }
        }

        function hideStatus() {
            status.className = 'status';
        }

        function setLoading(loading) {
            if (loading) {
                downloadBtn.classList.add('loading');
                downloadBtn.disabled = true;
                urlInput.disabled = true;
            } else {
                downloadBtn.classList.remove('loading');
                downloadBtn.disabled = false;
                urlInput.disabled = false;
            }
        }

        function showProgress() {
            progressContainer.classList.add('visible');
            progressBar.classList.add('indeterminate');
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            progressStatus.textContent = 'Starting download...';
        }

        function hideProgress() {
            progressContainer.classList.remove('visible');
            progressBar.classList.remove('indeterminate');
        }

        function updateProgress(loaded, total) {
            progressBar.classList.remove('indeterminate');
            const percent = total > 0 ? Math.round((loaded / total) * 100) : 0;
            progressBar.style.width = percent + '%';
            progressPercent.textContent = percent + '%';

            const loadedMB = (loaded / 1024 / 1024).toFixed(1);
            if (total > 0) {
                const totalMB = (total / 1024 / 1024).toFixed(1);
                progressStatus.textContent = `Downloading... ${loadedMB} MB / ${totalMB} MB`;
            } else {
                progressStatus.textContent = `Downloading... ${loadedMB} MB`;
            }
        }

        async function handleDownload() {
            const url = urlInput.value.trim();

            if (!url) {
                showStatus('error', '⚠️', 'Please enter a YouTube URL');
                urlInput.focus();
                return;
            }

            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                showStatus('error', '⚠️', 'Please enter a valid YouTube URL');
                urlInput.focus();
                return;
            }

            hideStatus();
            hideProgress();
            setLoading(true);

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw { raw: errorText, friendly: parseYtdlpError(errorText) };
                }

                // Show progress bar only after download starts
                showProgress();

                // Get filename from Content-Disposition header
                const disposition = response.headers.get('Content-Disposition');
                let filename = 'download.mp3';
                if (disposition) {
                    // Prefer filename* (RFC 5987 UTF-8 encoded) over plain filename
                    const starMatch = disposition.match(/filename\*\s*=\s*UTF-8''(.+?)(?:;|$)/i);
                    if (starMatch) {
                        try {
                            filename = decodeURIComponent(starMatch[1].trim());
                        } catch (e) {
                            filename = starMatch[1].trim();
                        }
                    } else {
                        const match = disposition.match(/filename="(.+?)"/);
                        if (match) filename = match[1];
                    }
                }

                // Get total size if available
                const contentLength = response.headers.get('Content-Length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;

                // Read response body with progress tracking
                const reader = response.body.getReader();
                const chunks = [];
                let loaded = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;
                    updateProgress(loaded, total);
                }

                // Combine chunks into blob
                const blob = new Blob(chunks);
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);

                hideProgress();
                showStatus('success', '✅', `Downloaded: ${filename}`);
            } catch (err) {
                hideProgress();
                if (err.friendly) {
                    showStatus('error', '❌', err.friendly, err.raw);
                } else {
                    showStatus('error', '❌', err.message || 'Something went wrong');
                }
            } finally {
                setLoading(false);
            }
        }

        function parseYtdlpError(raw) {
            // Extract the most relevant ERROR line from yt-dlp output
            const errorMatch = raw.match(/ERROR:\s*(.+)/i);
            if (errorMatch) {
                const msg = errorMatch[1].trim();
                if (msg.includes('Requested format is not available')) {
                    return 'Requested format is not available. The video may be restricted or unavailable.';
                }
                if (msg.includes('Video unavailable')) {
                    return 'This video is unavailable or private.';
                }
                if (msg.includes('is not a valid URL')) {
                    return 'The URL you entered is not valid.';
                }
                return msg.length > 150 ? msg.substring(0, 150) + '...' : msg;
            }
            if (raw.includes('Signature solving failed')) {
                return 'YouTube signature solving failed. The server may need Deno or an update.';
            }
            if (raw.includes('Failed to run yt-dlp')) {
                return 'yt-dlp is not installed on the server.';
            }
            return raw.length > 150 ? raw.substring(0, 150) + '...' : raw;
        }
    </script>
</body>
