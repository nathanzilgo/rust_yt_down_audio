[package]
name = "yt_down"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
local-ip-address = "0.6.10"

[[bin]]
name = "yt_down"
path = "src/main.rs"

[[bin]]
name = "yt_down_web"
path = "src/bin/web.rs"
