# Substitution variables:
#   _REGION: deployment region (default: us-central1)
#   _SERVICE_NAME: Cloud Run service name (default: yt-down)

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}', '.']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}']

  # Deploy to Cloud Run with secret mounted
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=600'
      - '--concurrency=10'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--update-secrets=/secrets/cookies.txt=youtube-cookies:latest'

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: yt-down

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}'
